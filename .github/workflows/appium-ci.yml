name: Appium CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      # CI ortamında emulator/cihaz yoktur: BaseTest, CI=true iken UI testlerini
      # (Assumptions) atlar. Bu adım projenin derlendiğini ve testlerin
      # keşfedildiğini doğrular.
      - name: Build and run tests (UI tests are skipped in CI)
        run: mvn -B test